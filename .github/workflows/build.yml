name: Build and test A50 VoiceClean
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload editor and CLI executables
        uses: actions/upload-artifact@v4
        with:
          name: A50-VoiceClean-WASAPI-dev-Windows-x64
          path: |
            build/Release/A50VoiceClean-GUI.exe
            build/Release/a50voiceclean.exe
          if-no-files-found: error
  linux-dsp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test DSP
        run: ctest --test-dir build --output-on-failure
