name: Build and test Windows prototype
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload prototype executable
        uses: actions/upload-artifact@v4
        with:
          name: A50-VoiceClean-offline-prototype-win64
          path: build/Release/a50voiceclean.exe
          if-no-files-found: error
